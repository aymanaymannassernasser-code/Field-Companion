<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#f8f7f4" />
  <meta name="description" content="Field Companion – Motor & Equipment Log for MOPCO" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="Field" />
  <meta name="mobile-web-app-capable" content="yes" />
  <link rel="manifest" href="manifest.json" />
  <link rel="apple-touch-icon" href="icons/icon-192.png" />
  <link rel="icon" href="icons/icon-192.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <title>Field Companion</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

<!-- APP SHELL -->
<div id="app">

  <!-- HEADER -->
  <header id="top-bar">
    <div id="header-left">
      <span id="app-title">Field</span>
    </div>
    <div id="header-right">
      <span id="live-time"></span>
    </div>
  </header>

  <!-- MAIN CONTENT AREA -->
  <main id="content">

    <!-- ── VIEW: HOME ─────────────────────────── -->
    <section class="view active" id="view-home">
      <div class="view-header">
        <h1 class="view-title">Equipment Log</h1>
        <button class="btn-primary" id="btn-new-entry">+ New Entry</button>
      </div>

      <!-- FILTER BAR -->
      <div class="filter-bar">
        <button class="filter-chip active" data-filter="all">All</button>
        <button class="filter-chip" data-filter="inspection">Inspection</button>
        <button class="filter-chip" data-filter="maintenance">Maintenance</button>
        <button class="filter-chip" data-filter="fault">Fault</button>
        <button class="filter-chip" data-filter="reading">Reading</button>
      </div>

      <!-- SEARCH -->
      <div class="search-wrap">
        <input type="search" id="search-input" placeholder="Search by tag, motor, or note…" />
      </div>

      <!-- LOG LIST -->
      <div id="log-list">
        <div class="empty-state" id="empty-state">
          <div class="empty-icon">⚙</div>
          <p>No entries yet.<br/>Tap <strong>+ New Entry</strong> to begin.</p>
        </div>
      </div>
    </section>

    <!-- ── VIEW: FORM ─────────────────────────── -->
    <section class="view" id="view-form">
      <div class="view-header">
        <button class="btn-back" id="btn-back">← Back</button>
        <h1 class="view-title" id="form-title">New Entry</h1>
      </div>

      <div class="form-body">

        <div class="field-group">
          <label>Entry Type</label>
          <div class="type-selector" id="type-selector">
            <button class="type-btn active" data-type="inspection">Inspection</button>
            <button class="type-btn" data-type="maintenance">Maintenance</button>
            <button class="type-btn" data-type="fault">Fault</button>
            <button class="type-btn" data-type="reading">Reading</button>
          </div>
        </div>

        <div class="field-group">
          <label for="f-tag">Motor Tag / ID</label>
          <input type="text" id="f-tag" placeholder="e.g. M-101, P-23A" autocomplete="off" list="tag-suggestions" />
          <datalist id="tag-suggestions"></datalist>
        </div>

        <div class="field-group">
          <label for="f-location">Location / Area</label>
          <input type="text" id="f-location" placeholder="e.g. Unit 2, Cooling Tower" autocomplete="off" />
        </div>

        <div class="field-group" id="readings-group">
          <label>Readings <span class="label-hint">(optional)</span></label>
          <div class="readings-grid">
            <div class="reading-field">
              <span class="reading-label">Current (A)</span>
              <input type="number" id="r-current" placeholder="—" step="0.1" />
            </div>
            <div class="reading-field">
              <span class="reading-label">Temp (°C)</span>
              <input type="number" id="r-temp" placeholder="—" step="0.1" />
            </div>
            <div class="reading-field">
              <span class="reading-label">Vibration</span>
              <input type="number" id="r-vibration" placeholder="—" step="0.01" />
            </div>
            <div class="reading-field">
              <span class="reading-label">Hours Run</span>
              <input type="number" id="r-hours" placeholder="—" step="1" />
            </div>
          </div>
        </div>

        <div class="field-group">
          <label for="f-note">Notes</label>
          <textarea id="f-note" rows="4" placeholder="Describe findings, actions taken, or observations…"></textarea>
        </div>

        <div class="field-group">
          <label for="f-priority">Priority</label>
          <div class="priority-selector" id="priority-selector">
            <button class="priority-btn active" data-priority="normal">Normal</button>
            <button class="priority-btn" data-priority="watch">Watch</button>
            <button class="priority-btn" data-priority="urgent">Urgent</button>
          </div>
        </div>

        <div class="field-group">
          <label>
            <input type="checkbox" id="f-geo" />
            <span>Attach GPS location</span>
          </label>
          <div id="geo-status" class="geo-status"></div>
        </div>

        <div class="field-group">
          <label>Photo <span class="label-hint">(optional)</span></label>
          <div class="photo-area" id="photo-area">
            <input type="file" id="f-photo" accept="image/*" capture="environment" />
            <label for="f-photo" class="photo-label">
              <span class="photo-icon">📷</span>
              <span>Take or choose photo</span>
            </label>
            <img id="photo-preview" class="photo-preview hidden" alt="Preview" />
            <button class="btn-remove-photo hidden" id="btn-remove-photo">Remove</button>
          </div>
        </div>

        <div class="form-actions">
          <button class="btn-save" id="btn-save">Save Entry</button>
          <button class="btn-cancel" id="btn-cancel-form">Cancel</button>
        </div>

      </div>
    </section>

    <!-- ── VIEW: DETAIL ───────────────────────── -->
    <section class="view" id="view-detail">
      <div class="view-header">
        <button class="btn-back" id="btn-detail-back">← Back</button>
        <div class="detail-actions">
          <button class="btn-icon" id="btn-share-entry" title="Share">↑</button>
          <button class="btn-icon btn-danger" id="btn-delete-entry" title="Delete">✕</button>
        </div>
      </div>
      <div id="detail-content"></div>
    </section>

    <!-- ── VIEW: STATS ────────────────────────── -->
    <section class="view" id="view-stats">
      <div class="view-header">
        <h1 class="view-title">Overview</h1>
        <button class="btn-secondary" id="btn-export">Export CSV</button>
      </div>
      <div id="stats-content"></div>
    </section>

  </main>

  <!-- BOTTOM NAV -->
  <nav id="bottom-nav">
    <button class="nav-btn active" data-view="home">
      <span class="nav-icon">≡</span>
      <span class="nav-label">Log</span>
    </button>
    <button class="nav-btn" data-view="stats">
      <span class="nav-icon">◎</span>
      <span class="nav-label">Stats</span>
    </button>
  </nav>

</div>

<!-- TOAST -->
<div id="toast"></div>

<!-- CONFIRM MODAL -->
<div id="modal-overlay" class="hidden">
  <div id="modal-box">
    <p id="modal-message"></p>
    <div class="modal-actions">
      <button id="modal-confirm" class="btn-danger-solid">Delete</button>
      <button id="modal-cancel" class="btn-secondary">Cancel</button>
    </div>
  </div>
</div>

<script src="js/db.js"></script>
<script src="js/app.js"></script>
<script>
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('./sw.js').catch(() => {});
  }
</script>
</body>
</html>
